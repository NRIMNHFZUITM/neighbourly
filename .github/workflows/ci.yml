name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run kb:build
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  demo-flow:
    name: Demo script (end to end)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start the app
        run: |
          npm run dev > dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:5173/ > /dev/null && curl -sf http://127.0.0.1:8787/api/health > /dev/null && exit 0
            sleep 1
          done
          cat dev.log
          exit 1
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: demo-flow-failure
          path: demo-flow-failure.png
