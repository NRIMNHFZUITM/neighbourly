<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Neighbourly video frames</title>
<style>
  @font-face {
    font-family: "Jakarta";
    src: url("../../node_modules/@fontsource-variable/plus-jakarta-sans/files/plus-jakarta-sans-latin-wght-normal.woff2") format("woff2");
    font-weight: 200 800;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  body { font-family: "Jakarta", "Segoe UI", sans-serif; color: #121212; -webkit-font-smoothing: antialiased; }
  .bg { position: absolute; inset: 0; background: radial-gradient(circle at 88% 8%, rgba(246,169,9,.16), transparent 38%), radial-gradient(circle at 4% 96%, rgba(215,25,32,.10), transparent 40%), #f4f4f5; }
  .abs { position: absolute; }
  .emoji { font-family: "Segoe UI Emoji", sans-serif; }
  .chip { display: inline-flex; align-items: center; gap: 12px; font-size: 21px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #d71920; }
  .chip b { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 11px; background: #d71920; color: #fff; font-size: 18px; letter-spacing: 0; }
  .caption { position: absolute; left: 50%; transform: translateX(-50%); max-width: 1640px; width: max-content; padding: 16px 32px; border-radius: 20px;
    background: rgba(18,18,18,.9); color: #fff; font-size: 28px; line-height: 1.38; font-weight: 500; text-align: center; }
  .window { position: absolute; border-radius: 16px; background: #fff; box-shadow: 0 40px 90px -35px rgba(18,18,18,.5), 0 0 0 1px rgba(18,18,18,.08); }
  .toolbar { height: 40px; display: flex; align-items: center; gap: 9px; padding: 0 16px; border-bottom: 1px solid #ececec; }
  .dot { width: 13px; height: 13px; border-radius: 50%; }
  .url { margin-left: 18px; flex: 1; max-width: 520px; height: 26px; border-radius: 8px; background: #f4f4f5; display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 15px; color: #737373; }
  .panel h2 { font-size: 54px; line-height: 1.08; font-weight: 800; letter-spacing: -.02em; margin-top: 22px; }
  .panel ul { list-style: none; margin-top: 34px; display: flex; flex-direction: column; gap: 22px; }
  .panel li { display: flex; gap: 18px; align-items: flex-start; font-size: 27px; line-height: 1.3; font-weight: 600; color: #262626; }
  .panel li .emoji { flex: none; width: 54px; height: 54px; border-radius: 16px; background: #fff; box-shadow: 0 6px 18px -10px rgba(0,0,0,.3); display: grid; place-items: center; font-size: 28px; }
  .phone { position: absolute; background: #121212; box-shadow: 0 40px 80px -30px rgba(18,18,18,.55); }
  .label { position: absolute; text-align: center; font-size: 28px; font-weight: 800; }
  .label span { display: block; font-size: 21px; font-weight: 500; color: #737373; margin-top: 4px; }
  .swatch { display: flex; align-items: center; gap: 12px; padding: 10px 18px 10px 10px; border-radius: 999px; background: #fff; box-shadow: 0 6px 18px -12px rgba(0,0,0,.4); font-size: 19px; font-weight: 700; }
  .swatch i { width: 34px; height: 34px; border-radius: 50%; }
  /* Mask mode: white where video shows */
  .mask { position: absolute; inset: 0; background: #fff; }
</style>
</head>
<body>
<div id="root"></div>
<script>
/** Screen rectangles (where recordings go), shared with build.ts through window.LAYOUTS. */
const LAYOUTS = {
  browser: { screens: [{ x: 64, y: 136, w: 1200, h: 750, r: [0, 0, 16, 16] }] },
  showcase: {
    screens: [
      { x: 112, y: 160, w: 1152, h: 720, r: [6, 6, 6, 6] },
      { x: 1430, y: 176, w: 330, h: 714, r: [38, 38, 38, 38] },
    ],
  },
  phones3: {
    screens: [
      { x: 263, y: 104, w: 330, h: 714, r: [38, 38, 38, 38] },
      { x: 795, y: 104, w: 330, h: 714, r: [38, 38, 38, 38] },
      { x: 1327, y: 104, w: 330, h: 714, r: [38, 38, 38, 38] },
    ],
  },
};
window.LAYOUTS = LAYOUTS;

function html(s) { document.getElementById("root").insertAdjacentHTML("beforeend", s); }
const px = (n) => `${n}px`;

function phoneBezel(s) {
  const b = 13;
  html(`<div class="phone" style="left:${px(s.x - b)};top:${px(s.y - b)};width:${px(s.w + 2 * b)};height:${px(s.h + 2 * b)};border-radius:${px(s.r[0] + b)}"></div>`);
}

/**
 * mode "bg": everything under the recordings. mode "fg": things drawn over them (none for now). mode "mask": white rounded rectangle for screen `index`, on black.
 */
window.render = ({ layout, mode, index = 0, chip, title, bullets = [], caption, url, labels = [], swatches = false }) => {
  const root = document.getElementById("root");
  root.innerHTML = "";
  const L = LAYOUTS[layout];
  if (mode === "mask") {
    const s = L.screens[index];
    document.body.style.cssText = `width:${s.w}px;height:${s.h}px;background:#000`;
    html(`<div class="mask" style="border-radius:${s.r.map(px).join(" ")}"></div>`);
    return { width: s.w, height: s.h };
  }
  document.body.style.cssText = "";
  if (mode === "fg") {
    return { width: 1920, height: 1080 };
  }
  html(`<div class="bg"></div>`);
  if (layout === "browser") {
    const s = L.screens[0];
    html(`<div class="window" style="left:${px(s.x)};top:${px(s.y - 40)};width:${px(s.w)};height:${px(s.h + 40)}">
      <div class="toolbar"><i class="dot" style="background:#ff5f57"></i><i class="dot" style="background:#febc2e"></i><i class="dot" style="background:#28c840"></i>
      <div class="url">🔒 <span style="color:#a3a3a3">neighbourly</span>${url || ""}</div></div></div>`);
    html(`<div class="abs panel" style="left:1320px;top:120px;width:540px">
      <div class="chip"><b>03</b>The app</div><h2>${title}</h2>
      <ul>${bullets.map(([e, t]) => `<li><span class="emoji">${e}</span><span>${t}</span></li>`).join("")}</ul></div>`);
  }
  if (layout === "showcase") {
    const [lap, ph] = L.screens;
    html(`<div class="abs" style="left:${px(lap.x - 16)};top:${px(lap.y - 16)};width:${px(lap.w + 32)};height:${px(lap.h + 32)};border-radius:22px;background:#1c1c1c;box-shadow:0 40px 90px -35px rgba(18,18,18,.6)"></div>`);
    html(`<div class="abs" style="left:${px(lap.x - 70)};top:${px(lap.y + lap.h + 16)};width:${px(lap.w + 140)};height:30px;border-radius:0 0 26px 26px;background:linear-gradient(#d4d4d8,#a1a1aa)"></div>`);
    html(`<div class="abs" style="left:${px(lap.x + lap.w / 2 - 90)};top:${px(lap.y + lap.h + 16)};width:180px;height:10px;border-radius:0 0 10px 10px;background:#8b8b93"></div>`);
    phoneBezel(ph);
    html(`<div class="abs" style="left:112px;top:52px;display:flex;align-items:center;gap:26px"><div class="chip"><b>03</b>The app</div>
      <div style="font-size:44px;font-weight:800;letter-spacing:-.02em">${title}</div></div>`);
    if (swatches) {
      html(`<div class="abs" style="right:150px;top:56px;display:flex;gap:14px">
        <div class="swatch"><i style="background:#d71920"></i>Heritage red</div><div class="swatch"><i style="background:#f6a909"></i>Warm yellow</div>
        <div class="swatch"><i style="background:#121212"></i>Charcoal</div><div class="swatch"><i style="background:#e5e5e5"></i>Neutral grey</div></div>`);
    }
  }
  if (layout === "phones3") {
    L.screens.forEach((s, i) => {
      phoneBezel(s);
      const [t, sub] = labels[i] || ["", ""];
      html(`<div class="label" style="left:${px(s.x - 60)};top:${px(s.y + s.h + 34)};width:${px(s.w + 120)}">${t}<span>${sub}</span></div>`);
    });
    html(`<div class="abs" style="left:64px;top:64px"><div class="chip"><b>03</b>The app</div></div>`);
  }
  if (caption) html(`<div class="caption" style="bottom:28px">${caption}</div>`);
  return { width: 1920, height: 1080 };
};
</script>
</body>
</html>
